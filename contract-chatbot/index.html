<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>서울특별시교육청 계약업무 처리지침 챗봇</title><style>body{font-family:system-ui,sans-serif;margin:0;display:grid;place-items:center;min-height:100vh;background:#f5f7fb;color:#334155}.box{padding:28px 32px;background:white;border:1px solid #e5e7eb;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.08)}small{display:block;margin-top:8px;color:#64748b}</style></head>
<body><div class="box"><b>계약업무 지침 챗봇을 불러오는 중입니다.</b><small>서울특별시교육청 2023.12.27. 개정자료</small></div>
<script>(async()=>{try{const files=['parts/part01.txt', 'parts/part02.txt', 'parts/part03.txt', 'parts/part04.txt', 'parts/part05.txt', 'parts/part06.txt', 'parts/part07.txt', 'parts/part08.txt', 'parts/part09.txt', 'parts/part10.txt', 'parts/part11.txt', 'parts/part12.txt'];const parts=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})));document.open();document.write(parts.join(''));document.close()}catch(e){document.body.innerHTML='<div class="box"><b>챗봇 파일을 불러오지 못했습니다.</b><small>'+e.message+'</small></div>'}})();</script></body></html>
